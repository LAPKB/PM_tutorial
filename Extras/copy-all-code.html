<button id="copy-all-code"
        style="position:fixed;top:1rem;right:1rem;z-index:2000;
               padding:.35rem .6rem;border:0;border-radius:.25rem;
               background:#2563eb;color:white;cursor:pointer;">
  Copy all code
</button>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const btn = document.getElementById('copy-all-code');

  // Grab all code blocks but skip those inside a wrapper marked copy disabled
  const grab = () => {
    const nodes = Array.from(
      document.querySelectorAll('div.sourceCode pre code, pre > code.sourceCode, pre > code')
    );
    const allowed = nodes.filter(n => !n.closest('div[data-code-copy="false"], div[data-copy-code="false"]')
    );
    return allowed.map(n => n.innerText).join('\n\n');
  };

  const copyText = async (txt) => {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(txt);
    } else {
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand('copy'); } finally { document.body.removeChild(ta); }
    }
  };

  btn.addEventListener('click', async () => {
    try {
      const txt = grab();
      if (!txt.trim()) { alert('No copyable code found.'); return; }
      await copyText(txt);
      const old = btn.textContent; btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = old, 1200);
    } catch(e) { alert('Copy failed: ' + e); }
  });
});
</script>
